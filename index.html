<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendation App</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <h1>Movie Recommendation App</h1>
    </header>

    <main>
        <div class="filters">
            <div id="first-three-inputs">
                <div class="select-group">
                    <label for="select-genre">GENRE </label>
                    <select name="genre" class="user-select" id="select-genre">
                        <option value="all">All</option>
                    </select>
                </div>

                <div class="select-group">
                    <label for="select-year">YEAR</label>
                    <select name="select-year" class="user-select" id="select-year">
                        <option value="all">All</option>
                    </select>
                </div>

                <div class="select-group">
                    <label for="lang-select">LANGUAGE</label>
                    <select name="select-lang" class="user-select" id="select-lang">
                        <option value="all">All</option>
                    </select>
                </div>
            </div>

            <div id="rating-group">
                <label for="select-rating">RATING</label>
                <select id="select-rating" class="user-select" id="select-rating">
                    <option value="all">All</option>
                </select>
            </div>
        </div>

        <div class="search-results">
            <span id="js-search-results"></span>
        </div>

        <div class="movies">
            <div class="headings">
                <div class="font flex hor-center first">RANK</div>
                <div class="font second">MOVIE</div>
                <div class="font flex hor-center third">YEAR</div>
            </div>
            <div id="movies-container"></div>
        </div>
    </main>
    <script src="./app.js"></script>
</body>

</html>
